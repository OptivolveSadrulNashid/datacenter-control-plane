server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  # Hashed asset filenames, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same rewrite the Vite dev server applies (see vite.config.ts): the browser
  # only ever talks to this origin, so the API needs no CORS configuration and
  # the bearer token never crosses an origin boundary.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Forwarded for logging only. Fastify runs with trustProxy off, so `req.ip`
    # stays this container's address and every browser shares one rate-limit
    # bucket. That is the safer default: trusting a client-settable
    # X-Forwarded-For would turn the limiter into something anyone can bypass by
    # rotating a header.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Correlation ids are echoed back on every response; let the browser read it.
    proxy_pass_header x-correlation-id;
  }

  # Client-side routing: any unknown path is a React route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
