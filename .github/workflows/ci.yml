name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icp
          POSTGRES_PASSWORD: icp
          POSTGRES_DB: icp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U icp -d icp"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: icp
          RABBITMQ_DEFAULT_PASS: icp
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://icp:icp@localhost:5432/icp?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://icp:icp@localhost:5672
      JWT_SECRET: ci-only-secret-change-me
      PROVISION_DELAY_MS: 0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm test
        env:
          RUN_INTEGRATION: '1'

  # The frontend has its own dependency tree, so it builds independently of the
  # API job. `npm run build` typechecks before bundling, which is the only
  # automated guard on the UI.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t infrastructure-control-plane:${{ github.sha }} .
      - run: docker build -t infrastructure-control-plane-web:${{ github.sha }} ./web
